name: Main2Main Interface Gray (CPU, read-only QA)
run-name: Flow-owned detection and original QA gray

on:
  workflow_dispatch:
    inputs:
      combined_smoke:
        description: Validate production detection call site and original read-only QA
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  flow-checks:
    if: github.repository == 'zhao-stack/vllm-ascend' && inputs.combined_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zhao-stack/main2main_flow
          ref: 252e0c96a2b99a9a7386fa8a084627cc2d09148b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python -B -m unittest discover -s tests -p 'test_interface_*.py' -v

  flow-owned-smoke:
    needs: flow-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: gray-code
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zhao-stack/main2main_flow
          ref: 252e0c96a2b99a9a7386fa8a084627cc2d09148b
          path: flow-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm-ascend
          ref: 6556ad5af1baaf481e996fc2788e233ce672f98e
          fetch-depth: 0
          path: ascend-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: 85c09e9885e346ea1612da30ebff5a75f67d2350
          fetch-depth: 0
          path: vllm-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned flow and QA runtime
        run: |
          pip install -e ./flow-source
          npm install -g opencode-ai@1.18.32
          opencode --version
      - name: Check secret availability without using it
        env:
          MAIN2MAIN_API_KEY: ${{ secrets.MAIN2MAIN_API_KEY }}
        run: test -n "$MAIN2MAIN_API_KEY"
      - name: Production scan call site, cache reuse and no-change path
        run: python -B gray-code/tools/main2main_gray/flow_owned_smoke.py scan
      - name: Real original QA with report bound to flow state
        timeout-minutes: 12
        env:
          MAIN2MAIN_API_KEY: ${{ secrets.MAIN2MAIN_API_KEY }}
          MAIN2MAIN_ADAPTER_TIMEOUT_MINUTES: '8'
          SKIP_E2E_TEST: 'true'
          PUSH_TO_GITHUB: 'false'
        run: python -B gray-code/tools/main2main_gray/flow_owned_smoke.py qa
      - name: Publish acceptance summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('## Flow-owned interface gray\n\n')
              for name in ('scan-acceptance.json', 'qa-acceptance.json'):
                  path = Path('output') / name
                  if path.exists():
                      stream.write('### ' + name + '\n\n```json\n')
                      stream.write(json.dumps(json.loads(path.read_text()), ensure_ascii=False, indent=2))
                      stream.write('\n```\n\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-owned-gray-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
