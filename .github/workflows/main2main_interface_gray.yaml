name: Main2Main Interface Gray (CPU, read-only QA)
run-name: Interface gray ${{ inputs.target_commit }} / cache ${{ inputs.cache_generation }}

on:
  workflow_dispatch:
    inputs:
      combined_smoke:
        description: Fresh historical scan followed by original adapter-qa; CPU only
        type: boolean
        default: false
      resolver_smoke:
        description: Test source resolution and failure/skip paths on CPU with no model calls
        type: boolean
        default: false
      adapter_smoke:
        description: Run original adapter-qa on a fixed historical diff and existing report; no adaptation
        type: boolean
        default: false
      target_commit:
        description: Target vLLM full SHA; empty selects main once
        required: false
        default: ''
      ascend_source_sha:
        description: Optional historical Ascend SHA; empty resolves main and fork baseline
        required: false
        default: ''
      engine_sha:
        description: Exact complete-engine commit in this fork
        required: true
        default: '0b2d7f1adb822977ac8e8466e3a101e928bd86ba'
      qa_enabled:
        description: Review Markdown with one bounded DeepSeek request (requires MAIN2MAIN_API_KEY)
        type: boolean
        default: false
      qa_max_calls:
        description: Maximum QA requests; split only at complete root boundaries
        type: choice
        options: ['1', '2', '3', '4']
        default: '1'
      force_rescan:
        description: Bypass report reuse for this run
        type: boolean
        default: false
      cache_generation:
        description: Increment to replace an immutable bad cache
        required: true
        default: '1'

permissions:
  contents: read

concurrency:
  group: main2main-interface-gray-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'zhao-stack/vllm-ascend' && !inputs.adapter_smoke && !inputs.resolver_smoke && !inputs.combined_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate dispatch inputs
        env:
          TARGET_SHA: ${{ inputs.target_commit }}
          ASCEND_SHA: ${{ inputs.ascend_source_sha }}
          ENGINE_SHA: ${{ inputs.engine_sha }}
          CACHE_GENERATION: ${{ inputs.cache_generation }}
        run: |
          set -euo pipefail
          [[ "$ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          for value in "$TARGET_SHA" "$ASCEND_SHA"; do
            [[ -z "$value" || "$value" =~ ^[0-9a-f]{40}$ ]] || exit 1
          done
          [[ "$CACHE_GENERATION" =~ ^[0-9]+$ ]] || exit 1

      - name: Checkout gray runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: gray-code
          persist-credentials: false

      - name: Check optional QA credential
        if: inputs.qa_enabled
        env:
          MAIN2MAIN_API_KEY: ${{ secrets.MAIN2MAIN_API_KEY }}
        run: |
          if [[ -z "$MAIN2MAIN_API_KEY" ]]; then
            mkdir -p output/qa
            printf '%s\n' '{"qa":"blocked_missing_credential","model_calls":0}' > output/qa/qa-status.json
            echo '::error::Configure MAIN2MAIN_API_KEY in this fork; no model request was made.'
            exit 1
          fi

      - name: Checkout pinned complete engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.engine_sha }}
          path: engine
          sparse-checkout: tools/vllm_interface_contracts
          persist-credentials: false

      - name: Checkout pinned vLLM source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: vllm-project/vllm
          ref: ${{ inputs.target_commit || 'main' }}
          path: vllm-source
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Checkout pinned Ascend baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: vllm-project/vllm-ascend
          ref: ${{ inputs.ascend_source_sha || 'main' }}
          path: ascend-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python (no runtime packages)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Resolve source and freeze upgrade range
        id: range
        env:
          TARGET_SHA: ${{ inputs.target_commit }}
          ASCEND_SHA: ${{ inputs.ascend_source_sha }}
          GRAY_REPOSITORY: ${{ github.repository }}
        run: |
          args=()
          if [[ -z "$ASCEND_SHA" ]]; then
            args+=(--baseline-url "https://github.com/${GRAY_REPOSITORY}.git")
          fi
          python -B gray-code/tools/main2main_gray/resolve.py \
            --vllm-root vllm-source --ascend-root ascend-source \
            --target "$TARGET_SHA" --output output/resolved-range.json \
            --github-output "$GITHUB_OUTPUT" "${args[@]}"

      - name: Verify frozen sources and compute report fingerprint
        id: inputs
        env:
          OLD_SHA: ${{ steps.range.outputs.vllm_old_sha }}
          NEW_SHA: ${{ steps.range.outputs.vllm_new_sha }}
          ASCEND_SHA: ${{ steps.range.outputs.vllm_ascend_sha }}
          ENGINE_SHA: ${{ inputs.engine_sha }}
        run: |
          python -B gray-code/tools/main2main_gray/run.py prepare \
            --engine-root engine --engine-sha "$ENGINE_SHA" \
            --vllm-root vllm-source --old "$OLD_SHA" --new "$NEW_SHA" \
            --ascend-root ascend-source --ascend-sha "$ASCEND_SHA" \
            --resolved-range output/resolved-range.json \
            --output output --github-output "$GITHUB_OUTPUT"

      - name: Restore exact report cache
        id: cache
        if: ${{ steps.range.outputs.has_changes == 'true' && !inputs.force_rescan }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: report-cache
          key: ${{ steps.inputs.outputs.cache_key }}-g${{ inputs.cache_generation }}

      - name: Analyze or reuse report (QA disabled)
        id: scan
        env:
          FORCE_RESCAN: ${{ inputs.force_rescan }}
        run: |
          args=()
          if [[ "$FORCE_RESCAN" == 'true' ]]; then args+=(--force-rescan); fi
          python -B gray-code/tools/main2main_gray/run.py scan \
            --output output --cache-dir report-cache \
            --github-output "$GITHUB_OUTPUT" "${args[@]}"

      - name: Save successful report cache
        if: ${{ success() && steps.range.outputs.has_changes == 'true' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: report-cache
          key: ${{ steps.inputs.outputs.cache_key }}-g${{ inputs.cache_generation }}

      - name: Read-only QA of the single Markdown
        if: ${{ inputs.qa_enabled && steps.range.outputs.has_changes == 'true' }}
        timeout-minutes: 13
        env:
          QA_MAX_CALLS: ${{ inputs.qa_max_calls }}
          MAIN2MAIN_API_KEY: ${{ secrets.MAIN2MAIN_API_KEY }}
        run: |
          python -B gray-code/tools/main2main_gray/qa.py \
            --input output/qa-review.md --output output/qa --max-calls "$QA_MAX_CALLS"

      - name: Publish run summary
        if: always()
        env:
          QA_ENABLED: ${{ inputs.qa_enabled }}
        run: |
          if [[ -f output/summary.md ]]; then
            if [[ "$QA_ENABLED" == 'true' ]]; then
              sed '/^- QA:/d; /QA input:/d' output/summary.md >> "$GITHUB_STEP_SUMMARY"
            else
              cat output/summary.md >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'Scan did not complete. Inspect step logs and artifacts.' >> "$GITHUB_STEP_SUMMARY"
            if [[ -f output/run-status.json ]]; then cat output/run-status.json; fi
          fi
          if [[ -f output/qa/qa-status.json ]]; then
            echo '### Actual QA execution' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat output/qa/qa-status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload single Markdown for QA
        if: ${{ always() && hashFiles('output/qa-review.md') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main2main-qa-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/qa-review.md
          if-no-files-found: error
          retention-days: 14


      - name: Upload QA verdict Markdown
        if: ${{ always() && hashFiles('output/qa/qa-verdict.md') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main2main-qa-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/qa/qa-verdict.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload internal scan diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main2main-interface-gray-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/
            !output/qa-review.md
          if-no-files-found: warn
          retention-days: 14
  adapter-smoke:
    if: github.repository == 'zhao-stack/vllm-ascend' && (inputs.adapter_smoke || inputs.combined_smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: gray-code
      - uses: actions/checkout@v4
        with:
          repository: zhao-stack/main2main_flow
          ref: 930f7b4f8ec315d0300928a63707638086753374
          persist-credentials: false
          path: flow-source
      - uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm-ascend
          ref: 6556ad5af1baaf481e996fc2788e233ce672f98e
          fetch-depth: 0
          persist-credentials: false
          path: ascend-source
      - uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: 85c09e9885e346ea1612da30ebff5a75f67d2350
          fetch-depth: 0
          persist-credentials: false
          path: vllm-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve fixed historical report
        if: ${{ !inputs.combined_smoke }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35225109799 --repo zhao-stack/vllm-ascend \
            --name main2main-qa-review-35225109799-1 --dir report-input
          echo '209d7cc6c6e1f636a18a4015fa891b104e8228029375c290aee2aa52afb2f381  report-input/qa-review.md' | sha256sum -c -
      - name: Checkout complete pinned engine for combined smoke
        if: inputs.combined_smoke
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d1d7b77183c14007d185835a00b9d23c009d0134
          persist-credentials: false
          path: engine
      - name: Resolve historical range and generate a fresh report
        if: inputs.combined_smoke
        run: python -B gray-code/tools/main2main_gray/combined_smoke.py
      - name: Install exact companion PR candidate
        run: |
          pip install -e ./flow-source
          npm install -g opencode-ai@1.18.32
          opencode --version
          (cd flow-source && python -B -m unittest discover -s tests -p test_interface_report.py -v)
      - name: Original adapter-qa read-only consumption test
        env:
          MAIN2MAIN_API_KEY: ${{ secrets.MAIN2MAIN_API_KEY }}
          SKIP_E2E_TEST: 'true'
          PUSH_TO_GITHUB: 'false'
        run: python -B gray-code/tools/main2main_gray/adapter_smoke.py
      - name: Upload consumption evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-adapter-qa-${{ github.run_id }}
          path: output/
          retention-days: 14
      - name: Upload fresh combined scan evidence
        if: ${{ always() && inputs.combined_smoke }}
        uses: actions/upload-artifact@v4
        with:
          name: combined-scan-${{ github.run_id }}
          path: |
            scan-output/
            report-input/
          retention-days: 14
  resolver-smoke:
    if: github.repository == 'zhao-stack/vllm-ascend' && inputs.resolver_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: gray-code
      - uses: actions/checkout@v4
        with:
          ref: 0b2d7f1adb822977ac8e8466e3a101e928bd86ba
          persist-credentials: false
          path: engine
      - uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm-ascend
          ref: 6556ad5af1baaf481e996fc2788e233ce672f98e
          fetch-depth: 0
          persist-credentials: false
          path: ascend-source
      - uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: 85c09e9885e346ea1612da30ebff5a75f67d2350
          fetch-depth: 0
          persist-credentials: false
          path: vllm-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test skip failure cache and nontrivial rebase paths
        run: |
          mkdir -p output
          python -B gray-code/tools/main2main_gray/test_run.py --engine-root engine 2>&1 | tee output/fixture-tests.log
          python -B gray-code/tools/main2main_gray/test_qa.py 2>&1 | tee output/qa-tests.log
      - name: Resolve isolated remote baseline and absent baseline
        run: python -B gray-code/tools/main2main_gray/resolver_smoke.py
      - name: Upload resolver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolver-smoke-${{ github.run_id }}
          path: output/
          retention-days: 14

  formal-lint:
    if: github.repository == 'zhao-stack/vllm-ascend' && inputs.combined_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1d7b77183c14007d185835a00b9d23c009d0134
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B tools/main2main_interface/test_run.py --engine-root . -v
      - run: pip install -r requirements-lint.txt
      - run: bash format.sh ci
